name: Experimental RPC Windows release

on:
  push:
    tags:
      - "rpc-v*"

permissions:
  contents: write

jobs:
  windows-cuda:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d
        env:
          RUNNER_DEBUG: "1"
        with:
          # CUDA 13.2.2 contains the sm_120 compiler fix; 13.2.0 and 13.2.1 are known-bad.
          cuda: "13.2.2"
          # The network bootstrap exits with a package-install error on hosted Windows;
          # use the full bundle so installation does not need secondary downloads.
          method: local
          # Ninja invokes nvcc directly, so the optional Visual Studio IDE integration is not needed.
          sub-packages: '["nvcc", "cudart_dev", "cublas_dev"]'

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Install the matching CUDA runtime libraries
        shell: pwsh
        run: python -m pip install --disable-pip-version-check nvidia-cublas==13.2.2.2 nvidia-cuda-runtime==13.2.86

      - name: Install CMake and Ninja
        shell: pwsh
        run: python -m pip install --disable-pip-version-check cmake==4.4.3 ninja==1.13.0

      - name: Configure, build, and test for RTX 4090 and RTX 5070 Ti
        shell: cmd
        run: |
          @echo off
          set "VSINSTALL=%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise"
          if not exist "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" exit /b 1
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=amd64
          if errorlevel 1 exit /b %errorlevel%
          cmake -S . -B build-rpc -G Ninja -DCMAKE_BUILD_TYPE=Release -DSTRATA_ENABLE_CUDA=ON -DSTRATA_BUILD_TESTS=ON -DSTRATA_PORTABLE=ON "-DCMAKE_CUDA_ARCHITECTURES=89;120"
          if errorlevel 1 exit /b %errorlevel%
          cmake --build build-rpc --parallel 2 --target strata rpc_transport_test
          if errorlevel 1 exit /b %errorlevel%
          ctest --test-dir build-rpc -R "^rpc_transport_test$" --output-on-failure
          if errorlevel 1 exit /b %errorlevel%

      - name: Package the engine
        shell: pwsh
        run: |
          python tools/package_rpc_windows.py --exe build-rpc/strata.exe --out dist --cuda-version 13.2.2 --archs 89,120
          $asset = "dist/strata-rpc-windows-x64.zip"
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  strata-rpc-windows-x64.zip" | Set-Content "$asset.sha256" -Encoding ascii

      - name: Create or update the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $asset = "dist/strata-rpc-windows-x64.zip"
          $checksum = "$asset.sha256"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset $checksum --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $tag --title "StrataRPC RPC experimental $tag" --notes-file docs/RPC.md --prerelease
          } else {
            gh release create $tag $asset $checksum --title "StrataRPC RPC experimental $tag" --notes-file docs/RPC.md --prerelease
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
