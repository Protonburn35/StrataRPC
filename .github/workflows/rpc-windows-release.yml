name: Experimental RPC Windows release

on:
  push:
    tags:
      - "rpc-v*"

permissions:
  contents: write

jobs:
  windows-cuda:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - name: Check the optional Ray worker supervisor
        shell: pwsh
        run: |
          python -m py_compile tools/layer_stage_ray.py tests/test_layer_stage_ray.py
          python tests/test_layer_stage_ray.py

      - uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462
        with:
          micromamba-version: "2.0.7-0"
          environment-name: cuda-build
          init-shell: cmd.exe
          post-cleanup: none
          create-args: >-
            --override-channels -c nvidia -c conda-forge
            cuda-nvcc=13.2.86 cuda-cudart-dev=13.2.86 libcublas-dev=13.4.1.3

      - name: Install the matching CUDA runtime libraries
        shell: pwsh
        run: python -m pip install --disable-pip-version-check nvidia-cublas==13.4.1.3 nvidia-cuda-runtime==13.2.86

      - name: Install CMake and Ninja
        shell: pwsh
        run: python -m pip install --disable-pip-version-check cmake==4.4.3 ninja==1.13.0

      - name: Configure, build, and test for RTX 4090 and RTX 5070 Ti
        shell: cmd /C call {0}
        run: |
          @echo off
          set "CUDA_PATH=%CONDA_PREFIX%\Library"
          set "CUDAToolkit_ROOT=%CUDA_PATH%"
          set "VSINSTALL=%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise"
          if not exist "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" exit /b 1
          if not exist "%CUDA_PATH%\bin\nvcc.exe" exit /b 1
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=amd64
          if errorlevel 1 exit /b %errorlevel%
          nvcc --version
          if errorlevel 1 exit /b %errorlevel%
          cmake -S . -B build-rpc -G Ninja -DCMAKE_BUILD_TYPE=Release -DSTRATA_ENABLE_CUDA=ON -DSTRATA_BUILD_TESTS=ON -DSTRATA_BUILD_CONVERSATION_TESTS=ON -DSTRATA_PORTABLE=ON -DCMAKE_CUDA_STANDARD=17 -DCMAKE_CUDA_STANDARD_REQUIRED=ON -DCMAKE_CUDA_EXTENSIONS=OFF -DCMAKE_CUDA_FLAGS=--std=c++17 "-DCMAKE_CUDA_COMPILER=%CUDA_PATH%\bin\nvcc.exe" "-DCUDAToolkit_ROOT=%CUDAToolkit_ROOT%" "-DCMAKE_CUDA_ARCHITECTURES=89;120" > configure.log 2>&1
          if errorlevel 1 (
            powershell -NoProfile -Command "$m = @(Select-String -Path configure.log -Pattern 'error|fatal|failed'); $x = @($m | Select-Object -First 10) + @($m | Select-Object -Last 10); if (-not $x) { $x = Get-Content configure.log -Tail 20 }; foreach ($i in $x) { Write-Output ('::error::' + $i.Line) }"
            exit /b 1
          )
          cmake --build build-rpc --parallel 2 --target strata rpc_transport_test layer_stage_rpc_test conversation_file_test conversation_snapshot_test expert_cache_layout_test router_lookahead_rpc_ownership_test > build.log 2>&1
          if errorlevel 1 (
            powershell -NoProfile -Command "$m = @(Select-String -Path build.log -Pattern 'nvcc.*device\.cu|--std=c\+\+|error|fatal|failed|stopped'); $x = @($m | Select-Object -First 10) + @($m | Select-Object -Last 10); if (-not $x) { $x = Get-Content build.log -Tail 20 }; foreach ($i in $x) { Write-Output ('::error::' + $i.Line) }"
            exit /b 1
          )
          ctest --test-dir build-rpc -R "^(rpc_transport_test|layer_stage_rpc_test|conversation_file_test|conversation_snapshot_test|expert_cache_layout_test|router_lookahead_rpc_ownership_test)$" --output-on-failure > ctest.log 2>&1
          if errorlevel 1 (
            powershell -NoProfile -Command "$x = Get-Content ctest.log -Tail 20; foreach ($i in $x) { Write-Output ('::error::' + $i) }"
            exit /b 1
          )
          type ctest.log

      - name: Fetch the pinned image encoder sources
        shell: pwsh
        run: python -c "import setup; setup.get_llama_cpp()"

      - name: Build the optional CUDA image encoder
        shell: cmd /C call {0}
        run: |
          @echo off
          set "CUDA_PATH=%CONDA_PREFIX%\Library"
          set "VSINSTALL=%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise"
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=amd64
          if errorlevel 1 exit /b %errorlevel%
          cmake -S tools/vision -B build-vision -G Ninja -DCMAKE_BUILD_TYPE=Release -DSTRATA_VISION_CUDA=ON -DSTRATA_PORTABLE=ON -DCMAKE_CUDA_STANDARD=17 "-DLLAMA_DIR=%CD%\third_party\llama.cpp" "-DCMAKE_CUDA_COMPILER=%CUDA_PATH%\bin\nvcc.exe" "-DCUDAToolkit_ROOT=%CUDA_PATH%" "-DCMAKE_CUDA_ARCHITECTURES=89;120" > vision-configure.log 2>&1
          if errorlevel 1 (
            powershell -NoProfile -Command "Get-Content vision-configure.log -Tail 30 | ForEach-Object { Write-Output ('::error::' + $_) }"
            exit /b 1
          )
          cmake --build build-vision --parallel 2 --target strata-vision > vision-build.log 2>&1
          if errorlevel 1 (
            powershell -NoProfile -Command "$m = @(Select-String -Path vision-build.log -Pattern 'error|fatal|failed|stopped'); $x = @($m | Select-Object -First 10) + @($m | Select-Object -Last 10); if (-not $x) { $x = Get-Content vision-build.log -Tail 20 }; foreach ($i in $x) { Write-Output ('::error::' + $i) }"
            exit /b 1
          )

      - name: Package the engine
        shell: pwsh
        run: |
          python tools/package_rpc_windows.py --exe build-rpc/strata.exe --vision-exe build-vision/bin/strata-vision.exe --out dist --cuda-version 13.2.2 --archs 89,120
          python tests/test_rpc_windows_package.py dist/strata-rpc-windows-x64.zip
          $asset = "dist/strata-rpc-windows-x64.zip"
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  strata-rpc-windows-x64.zip" | Set-Content "$asset.sha256" -Encoding ascii

      - name: Create or update the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $asset = "dist/strata-rpc-windows-x64.zip"
          $checksum = "$asset.sha256"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset $checksum --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release edit $tag --title "StrataRPC RPC experimental $tag" --notes-file docs/RPC.md --prerelease
          } else {
            gh release create $tag $asset $checksum --title "StrataRPC RPC experimental $tag" --notes-file docs/RPC.md --prerelease
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
