name: StrataRPCD Windows engine

# strata-dsv41.exe with the layer-stage split (src/dsv41/ds4_stage.*), for an RTX 4090 (sm_89) and an RTX 5070 Ti (sm_120).
# Builds on pushes to the stratarpcd branch that touch the engine (a commit whose title has [skip ci] does not), or by hand.
on:
  push:
    branches: [stratarpcd]
    paths:
      - src/dsv41/**
      - src/core/rpc_transport.cpp
      - src/core/layer_stage_codec.cpp
      - include/strata/core/rpc_transport.hpp
      - include/strata/core/layer_stage_codec.hpp
      - tests/dsv41/ds4_stage_test.cpp
      - tests/core/rpc_transport_test.cpp
      - CMakeLists.txt
      - scripts/stratarpcd/**
      - .github/workflows/stratarpcd-windows.yml
      - .github/stratarpcd/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-cuda:
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"

      - uses: mamba-org/setup-micromamba@add3a49764cedee8ee24e82dfde87f5bc2914462
        with:
          micromamba-version: "2.0.7-0"
          environment-name: cuda-build
          init-shell: cmd.exe
          post-cleanup: none
          create-args: >-
            --override-channels -c nvidia -c conda-forge
            cuda-nvcc=13.2.86 cuda-cudart-dev=13.2.86 libcublas-dev=13.4.1.3

      - name: Install CMake and Ninja
        shell: pwsh
        run: python -m pip install --disable-pip-version-check cmake==4.4.3 ninja==1.13.0

      - name: Fetch the pinned llama.cpp (ggml for the CPU lane's experts)
        shell: pwsh
        run: python -c "import setup; setup.get_llama_cpp()"

      - name: Check the StrataRPCD launch scripts (Windows PowerShell 5.1, dry runs on a made-up setup config)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($f in Get-ChildItem scripts/stratarpcd/*.ps1) {
            powershell -NoProfile -Command "`$e = `$null; [void][System.Management.Automation.Language.Parser]::ParseFile('$($f.FullName)', [ref]`$null, [ref]`$e); if (`$e) { `$e | ForEach-Object { Write-Output (`$_.Extent.StartLineNumber.ToString() + ': ' + `$_.Message) }; exit 1 }"
            if ($LASTEXITCODE -ne 0) { throw "$($f.Name) does not parse in Windows PowerShell 5.1" }
          }
          $t = Join-Path $env:RUNNER_TEMP "rpcd"
          New-Item -ItemType Directory -Force (Join-Path $t "engine-rpcd") | Out-Null
          Copy-Item scripts/stratarpcd/*.ps1 (Join-Path $t "engine-rpcd")
          Set-Content (Join-Path $t "engine-rpcd/strata-dsv41.exe") "not an exe"
          $cfg = @{ exe = "C:/elsewhere/strata-dsv41.exe"; cwd = $t; port = 8080; log = "$t/strata.log"; arch = "deepseek41"
                    args = @("--pack", "$t/packs/p", "--max-context", "8192", "--eos", "1", "--vision", "off", "--dspark", "auto") }
          [System.IO.File]::WriteAllText((Join-Path $t "strata-deepseek-v4.1-flash-ist-das-2.00bpw.json"), ($cfg | ConvertTo-Json -Depth 5))
          $env:STRATA_RPC_TOKEN = "test"
          $w = powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $t "engine-rpcd/start-worker.ps1") -DryRun | Out-String
          Write-Output $w
          if ($w -notmatch "DRYRUN worker: .*--pack .*--max-context 8192 .*--layer-stage-server 0\.0\.0\.0:39501 --layer-stage-split 20 --layer-stage-wire fp32") { throw "start-worker.ps1 built the wrong command" }
          $c = powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $t "engine-rpcd/start-coordinator.ps1") -Worker 10.0.0.2:39501 -Wire bf16 -Context 4096 -Port 8081 -DryRun | Out-String
          Write-Output $c
          if ($c -notmatch "DRYRUN coordinator: .*--port 8081") { throw "start-coordinator.ps1 did not stop at the dry run" }
          python -c "import json,sys; c=json.load(open(sys.argv[1],encoding='utf-8')); a=c['args']; print(a); assert a.count('--max-context')==1 and a[a.index('--max-context')+1]=='4096'; assert a[-6:]==['--layer-stage-client','10.0.0.2:39501','--layer-stage-split','20','--layer-stage-wire','bf16']; assert c['exe'].endswith('engine-rpcd\\strata-dsv41.exe') and c['port']==8081" (Join-Path $t "strata-stratarpcd-coordinator.json")
          if ($LASTEXITCODE -ne 0) { throw "the coordinator config is wrong" }

      - name: Layer-stage protocol tests (no GPU)
        shell: cmd /C call {0}
        run: |
          @echo off
          set "VSINSTALL=%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise"
          rem the same MSVC toolset as the engine build below (see there)
          set "MSVCVER="
          for /f "delims=" %%v in ('dir /b /ad /o-n "%VSINSTALL%\VC\Tools\MSVC\14.4*"') do if not defined MSVCVER set "MSVCVER=%%v"
          if not defined MSVCVER ( echo ::error::no VS 2022 MSVC toolset 14.4x in %VSINSTALL% & exit /b 1 )
          set "VSCMD_ARG_VCVARS_VER="
          set "VCToolsVersion="
          echo MSVC toolset %MSVCVER%
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=amd64 -vcvars_ver=%MSVCVER%
          if errorlevel 1 exit /b %errorlevel%
          cmake -S . -B build-stage -G Ninja -DCMAKE_BUILD_TYPE=Release -DSTRATA_ENABLE_CUDA=OFF -DSTRATA_ENABLE_HIP=OFF -DSTRATA_BUILD_STAGE_TESTS=ON -DSTRATA_BUILD_TESTS=OFF > stage-configure.log 2>&1
          if errorlevel 1 ( type stage-configure.log & exit /b 1 )
          cmake --build build-stage --target ds4_stage_test rpc_transport_test > stage-build.log 2>&1
          if errorlevel 1 ( type stage-build.log & exit /b 1 )
          ctest --test-dir build-stage -R "^(ds4_stage_test|rpc_transport_test)$" --output-on-failure
          if errorlevel 1 exit /b 1

      - name: Build strata-dsv41 for RTX 4090 and RTX 5070 Ti
        shell: cmd /C call {0}
        run: |
          @echo off
          set "CUDA_PATH=%CONDA_PREFIX%\Library"
          set "CUDAToolkit_ROOT=%CUDA_PATH%"
          set "VSINSTALL=%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise"
          if not exist "%CUDA_PATH%\bin\nvcc.exe" exit /b 1
          rem the conda environment's activation has already set up VS 2019's toolset (MSVC 14.29), which VsDevCmd keeps unless
          rem told otherwise, and nvcc ignores -std=c++20 with it ("not supported with the configured host compiler"): use
          rem VS 2022's own newest toolset (14.4x)
          set "MSVCVER="
          for /f "delims=" %%v in ('dir /b /ad /o-n "%VSINSTALL%\VC\Tools\MSVC\14.4*"') do if not defined MSVCVER set "MSVCVER=%%v"
          if not defined MSVCVER ( echo ::error::no VS 2022 MSVC toolset 14.4x in %VSINSTALL% & exit /b 1 )
          set "VSCMD_ARG_VCVARS_VER="
          set "VCToolsVersion="
          echo MSVC toolset %MSVCVER%
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=amd64 -vcvars_ver=%MSVCVER%
          if errorlevel 1 exit /b %errorlevel%
          nvcc --version
          rem the sources are C++20: find the flags that make this nvcc compile it (see the script), and stop here if none does
          powershell -NoProfile -ExecutionPolicy Bypass -File .github\stratarpcd\nvcc-dialect.ps1 -Nvcc "%CUDA_PATH%\bin\nvcc.exe" -Out "%RUNNER_TEMP%\cuda-flags.txt"
          if errorlevel 1 exit /b 1
          set "CUDA_DIALECT="
          set /p CUDA_DIALECT=<"%RUNNER_TEMP%\cuda-flags.txt"
          cmake -S . -B build-dsv41 -G Ninja -DCMAKE_BUILD_TYPE=Release -DSTRATA_ENABLE_CUDA=ON -DSTRATA_BUILD_TESTS=OFF -DSTRATA_BUILD_DSV41=ON -DSTRATA_NATIVE_EXPERTS=ON -DSTRATA_PORTABLE=ON "-DCMAKE_CUDA_FLAGS=%CUDA_DIALECT%" "-DCMAKE_CUDA_COMPILER=%CUDA_PATH%\bin\nvcc.exe" "-DCUDAToolkit_ROOT=%CUDAToolkit_ROOT%" "-DCMAKE_CUDA_ARCHITECTURES=89-real;120" "-DSTRATA_GGML_DIR=%CD%\third_party\llama.cpp" > configure.log 2>&1
          if errorlevel 1 (
            powershell -NoProfile -Command "$m = @(Select-String -Path configure.log -Pattern 'error|fatal|failed'); $x = @($m | Select-Object -First 15) + @($m | Select-Object -Last 15); if (-not $x) { $x = Get-Content configure.log -Tail 40 }; foreach ($i in $x) { Write-Output ('::error::' + $i) }"
            exit /b 1
          )
          cmake --build build-dsv41 --parallel 3 --target strata-dsv41 > build.log 2>&1
          if errorlevel 1 (
            powershell -NoProfile -Command "$l = @(Get-Content build.log); for ($i = 0; $i -lt $l.Count; $i++) { if ($l[$i] -like 'FAILED:*') { Write-Output 'the first failed step and its command:'; $l[$i..([Math]::Min($i + 2, $l.Count - 1))] | ForEach-Object { Write-Output $_ }; break } }"
            powershell -NoProfile -Command "$m = @(Select-String -Path build.log -Pattern 'error|fatal|failed|stopped'); $x = @($m | Select-Object -First 20) + @($m | Select-Object -Last 20); if (-not $x) { $x = Get-Content build.log -Tail 40 }; foreach ($i in $x) { Write-Output ('::error::' + $i) }"
            exit /b 1
          )
          dumpbin /dependents build-dsv41\strata-dsv41.exe > deps.txt
          type deps.txt

      - name: Package
        shell: pwsh
        run: |
          $out = "dist/StrataRPCD-engine"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item build-dsv41/strata-dsv41.exe $out/
          # the NVIDIA DLLs the exe imports, from the toolkit it was built with
          # (the micromamba environment is activated in the cmd steps only, so CONDA_PREFIX is not set in this one)
          $prefix = if ($env:CONDA_PREFIX) { $env:CONDA_PREFIX } else { Join-Path $env:MAMBA_ROOT_PREFIX "envs/cuda-build" }
          $bin = Join-Path $prefix "Library/bin"
          if (-not (Test-Path $bin)) { throw "no CUDA bin folder at $bin" }
          $deps = Get-Content deps.txt | ForEach-Object { $_.Trim() } | Where-Object { $_ -match '^(cublas|cublasLt|cudart)\S*\.dll$' }
          foreach ($d in $deps) {
            $src = Join-Path $bin $d
            if (-not (Test-Path $src)) { throw "missing $d in $bin" }
            Copy-Item $src $out/
          }
          if (Test-Path (Join-Path $bin "cublasLt64_13.dll")) { Copy-Item (Join-Path $bin "cublasLt64_13.dll") $out/ -Force }
          Copy-Item HANDOFF.md $out/
          Copy-Item docs/STRATARPCD.md $out/README-STRATARPCD.md
          Copy-Item scripts/stratarpcd/*.ps1 $out/
          $commit = (git rev-parse --short=9 HEAD)
          Set-Content "$out/BUILD.txt" "stratarpcd $commit, CUDA 13.2, sm_89 + sm_120"
          Get-ChildItem $out | Format-Table Name, Length
          & "$out/strata-dsv41.exe" --version
          if ($LASTEXITCODE -ne 0) { Write-Output "::warning::strata-dsv41.exe --version exited $LASTEXITCODE (this runner has no NVIDIA driver)" }
          $global:LASTEXITCODE = 0

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: StrataRPCD-engine-win-x64-cuda13-sm89-sm120
          path: dist/StrataRPCD-engine
          retention-days: 30
